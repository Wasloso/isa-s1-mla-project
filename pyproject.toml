[project]
name = "mla-project"
version = "0.1.0"
description = "A very fun ISA project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
]
[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=14.0.1",
]
[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=9.0.2",
    "ruff>=0.15.4",
]

[tool.ruff]
line-length = 120

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

# Might tweak later
[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PL"
]
ignore = [
    "ANN",
    "D",
    "ARG001",
    "PLR0913",
    "PLR2004",
    "COM812",
    "ISC001",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "N806",
    "N803",
    "RUF012",
]
unfixable = ["F401", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
